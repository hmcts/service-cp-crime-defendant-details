spring:
  application:
    name: service-cp-crime-defendant-details

server:
  port: ${SERVER_PORT:8082}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO

case-mapper-client:
  url: ${AMP_BACKEND_URL:http://localhost:8081}
  path: /urnmapper

progression-client:
  url: ${CP_BACKEND_URL:http://localhost:8081}
  path: /progression-query-api/query/api/rest/progression/prosecutioncases
  cjscppuid: ${CJSCPPUID:00000000-0000-0000-0000-000000000000}

# Microsoft Entra app-only access token validation
auth:
  mode: ${AUTH_MODE:ENFORCE}
  tenant-id: ${AUTH_TENANT_ID:}
  audience: ${AUTH_AUDIENCE:}
  issuer: ${AUTH_ISSUER:}
  jwks-uri: ${AUTH_JWKS_URI:}
  required-role: ${AUTH_REQUIRED_ROLE:DefendantDetails.Read}
  clock-skew-seconds: ${AUTH_CLOCK_SKEW_SECONDS:60}
  jwks-cache-ttl-seconds: ${AUTH_JWKS_CACHE_TTL_SECONDS:300}
